<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 650" width="600" height="650">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Black Background shape (or transparent badge container) -->
  <rect width="600" height="650" rx="36" fill="#000000"/>

  <!-- Outer White Flame Outline -->
  <path d="M 300,30
           C 325,85 365,130 405,175
           C 445,220 490,270 480,360
           C 470,440 435,510 380,555
           C 340,585 285,600 240,590
           C 185,580 145,540 120,490
           C 95,435 90,370 110,310
           C 125,270 150,235 155,190
           C 160,150 140,120 160,85
           C 180,135 220,170 245,195
           C 255,150 270,90 300,30 Z"
        fill="#e21d1d"
        stroke="#ffffff"
        stroke-width="18"
        stroke-linejoin="round"
        stroke-linecap="round"
        filter="url(#shadow)"/>

  <!-- Little Top Flame Accent inside flame tip -->
  <path d="M 300,140
           C 310,165 328,185 330,210
           C 332,235 315,255 295,255
           C 275,255 265,235 272,210
           C 278,185 290,165 300,140 Z"
        fill="#fed100"
        stroke="#f85c00"
        stroke-width="6"
        stroke-linejoin="round"/>

  <!-- TAITA wordmark: white, black outline, rounded bold -->
  <g id="taita-text">
    <text x="300" y="380"
          text-anchor="middle"
          font-family="'Impact', 'Arial Black', sans-serif"
          font-size="108"
          font-weight="900"
          letter-spacing="4"
          fill="#ffffff"
          stroke="#000000"
          stroke-width="20"
          paint-order="stroke fill">TAITA</text>
  </g>

  <!-- SHU wordmark: vibrant red, white outer border, bold black shadow -->
  <g id="shu-text">
    <text x="300" y="520"
          text-anchor="middle"
          font-family="'Impact', 'Arial Black', sans-serif"
          font-size="142"
          font-weight="900"
          letter-spacing="6"
          fill="#e21d1d"
          stroke="#000000"
          stroke-width="26"
          paint-order="stroke fill">SHU</text>
    <text x="300" y="520"
          text-anchor="middle"
          font-family="'Impact', 'Arial Black', sans-serif"
          font-size="142"
          font-weight="900"
          letter-spacing="6"
          fill="#e21d1d"
          stroke="#ffffff"
          stroke-width="10"
          paint-order="stroke fill">SHU</text>
  </g>
</svg>